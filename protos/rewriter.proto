syntax = "proto3";

package rewriter;

enum RewriteOp {
    TableNameRewrite = 0;
    LimitRewrite = 1;
    OffsetRewrite = 2;
    SettingsRewrite = 3;
    CommonTableExprRewrite = 4;
    DatabaseNameRewrite = 5;
    ShowTablesRewrite = 6;
}

message RewriteTableNameArgs {
    message RemoteTable {
        string addr = 1;
        string database = 2;
        string table = 3;
        string user = 4;
        string password = 5;
    }
    message TableWithDatabase {
        string database = 1;
        string table = 2;
    }
    map<string, string> table_map = 1;
    map<string, RemoteTable> remote_table_map = 2;
    map<string, TableWithDatabase> table_with_database_map = 3;
}

message RewriteLimitArgs {
    message ReplaceLimit {
        int32 threshold = 1;
        int32 replace_to = 2;
    }
    oneof value {
        ReplaceLimit replace_limit = 2; // replace limit if original limit is 0 or greater than [threshold].
        int32 force_limit = 3; // force replace any limit to this value, no matter what the original limit is.
    }
}

message RewriteOffsetArgs {
    int32 offset = 1;
}

message RewriteCommonTableExprArgs {
    message CommonTableExpr {
        string alias = 1;
        string sql = 2;
    }
    map<string, CommonTableExpr> cte_map = 1;
}

// DatabaseNameRewrite rewrites USE <db> statements.
// Three branches, evaluated in order (matches proxy regex semantics):
//   1. database_map hit (virtual/logical → physical):
//        → "USE <physical>"
//   2. known_physical_databases hit (target is already a real DB name):
//        → leave SQL unchanged, but caller still tracks target as current DB
//   3. default_database non-empty (fallback for unmapped names):
//        → "USE <default_database>", response.matched_processor_id = <target>
message RewriteDatabaseNameArgs {
    map<string, string> database_map = 1;
    repeated string known_physical_databases = 2;
    string default_database = 3;
}

// ShowTablesRewrite rewrites SHOW TABLES into a filtered SELECT.
// The C++ side parses the AST's FROM/IN clause itself and resolves the
// effective physical_database and logical_database(which is table prefix) using the full context below.
//
// Resolution order (matches proxy regex semantics):
//   logical := SHOW_TABLES_FROM_clause, else logical_database
//   physcial := physical_database
//   if logical not empty:                   -> physical as database, logical as table prefix
//   else                                    -> passthrough (response.show_tables_passthrough=true)
message RewriteShowTablesArgs {
    string physical_database = 3;
    string logical_database = 4;
}

enum SettingType {
    String = 0;
    Bool = 1;
    Int = 2;
    Uint64 = 3;
}

message RewriteSettingsArgs {
    message Setting {
        string key = 1;
        SettingType type = 2;
        oneof value {
            string string_value = 3;
            bool bool_value = 4;
            int32 int_value = 5;
            uint64 uint64_value = 6;
        }
    }
    repeated Setting settings = 1;
}

message RewriteOption {
    RewriteOp op = 1;
    oneof value {
        RewriteTableNameArgs table_name_args = 2;
        RewriteLimitArgs limit_args = 3;
        RewriteOffsetArgs offset_args = 4;
        RewriteSettingsArgs settings_args = 5;
        RewriteCommonTableExprArgs common_table_expr_args = 6;
        RewriteDatabaseNameArgs database_name_args = 7;
        RewriteShowTablesArgs show_tables_args = 8;
    }
}

message RewriteSQLRequest {
    string sql = 1;
    repeated RewriteOption options = 2;
}

enum RewriteCode {
    Success = 0;
    // SQL failed to parse via ClickHouse's ParserQuery. Message carries the
    // ClickHouse parser's displayText().
    SyntaxError = 1;
    // Kept as a catch-all for unexpected rewrite failures. Prefer the more
    // specific codes below for well-defined rejection cases; only fall back
    // to RewriteError when the classification truly isn't clear.
    RewriteError = 2;
    // The SQL is valid but the rewriter does not support this statement
    // kind or variant (CREATE VIEW, DROP DATABASE, TRUNCATE, OPTIMIZE,
    // RENAME DATABASE, EXISTS VIEW/DATABASE/DICTIONARY, SHOW CREATE
    // VIEW/DATABASE/DICTIONARY, INSERT INTO FUNCTION, multi-table DROP,
    // ALTER TABLE with cross-table partition refs, GRANT/KILL/BACKUP/...).
    // Callers may choose to pass the SQL through to ClickHouse unchanged.
    UnsupportedStatement = 3;
    // The caller's RewriteOption cannot be applied to this statement —
    // their rewrite config is semantically incorrect for the SQL they sent.
    // Callers should treat this as a configuration bug; do NOT pass the SQL
    // through. Current case: a write / EXISTS / SHOW CREATE target hits
    // remote_table_map (remote() is only meaningful as a SELECT source).
    InvalidRewriteRequest = 4;
}

// Statement kind the rewriter classified the request into. Callers use this
// for routing / authorization / metrics. Values are stable — adding new ones
// is fine, renumbering or reusing numbers is not. UNSPECIFIED is the default
// when no classification ran (e.g. parse error); non-Success responses may
// leave statement_type at UNSPECIFIED.
enum StatementType {
    STATEMENT_TYPE_UNSPECIFIED = 0;
    STATEMENT_TYPE_SELECT = 1;
    STATEMENT_TYPE_USE = 2;
    STATEMENT_TYPE_SHOW_TABLES = 3;
    STATEMENT_TYPE_SHOW_CREATE_TABLE = 4;
    STATEMENT_TYPE_EXISTS_TABLE = 5;
    STATEMENT_TYPE_CREATE_TABLE = 6;
    STATEMENT_TYPE_DROP_TABLE = 7;
    STATEMENT_TYPE_ALTER_TABLE = 8;
    STATEMENT_TYPE_RENAME_TABLE = 9;
    STATEMENT_TYPE_INSERT = 10;
    STATEMENT_TYPE_UPDATE = 11;
    STATEMENT_TYPE_DELETE = 12;
}

message RewriteSQLResponse {
    RewriteCode code = 1;
    string message = 2;
    string sql_after_rewrite = 3;
    // Tables that the original SQL referenced. For SELECT/DML this includes
    // tables reached through CTEs. Tables that TableNameRewrite rewrote are
    // still listed here with their original names; callers can cross-reference
    // `table_rewrites` to learn the post-rewrite form.
    repeated string original_accessed_table_names = 4;
    // Kind of statement the rewriter identified. See the StatementType enum
    // for the full list. UNSPECIFIED on non-Success responses whose
    // classification didn't run (parse errors, etc.).
    StatementType statement_type = 5;

    message UseStmtValue {
        // USE DatabaseNameRewrite: when the default_database fallback branch fired,
        // this is the original target name (caller uses it as the connection's
        // current processor_id so SHOW TABLES still filters correctly).
        string specified_database = 1;
    }

    message ShowStmtValue {
        // SHOW TABLES: true when the rewriter decided the caller should pass the
        // original SQL through (targetDB has no processor mapping and no
        // per-connection processor context). sql_after_rewrite is the original SQL
        // in this case.
        bool show_tables_passthrough = 2;
    }

    message WriteStmtValue {
        // DEPRECATED: prefer `table_rewrites` on the top-level response.
        // Kept for backward compatibility. Holds the post-rewrite primary
        // target of single-table write operations (CREATE/DROP/ALTER TABLE,
        // INSERT, UPDATE, DELETE). Format: "db.table" if the DB was specified
        // in the SQL, otherwise bare "table". Empty for non-write statements
        // and for RENAME (which has no single target; use `table_rewrites`).
        string target_table = 1 [deprecated = true];
    }

    oneof extra_value {
        UseStmtValue use_stmt_value = 6;
        ShowStmtValue show_stmt_value = 7;
        WriteStmtValue write_stmt_value = 8;
    }

    // Aliases of CTEs in CommonTableExprRewrite.cte_map whose `sql` failed
    // to parse. The rewriter silently skips such CTEs so the rest of the
    // rewrite still proceeds; surfaced here so callers can diagnose "my CTE
    // wasn't applied" without reading server logs. Empty on the happy path.
    repeated string failed_cte_aliases = 9;

    // Map of tables rewritten by TableNameRewrite, keyed by the original
    // "db.table" (or bare "table" when no db was present), mapping to the
    // post-rewrite "db.table" form. Only entries whose original differs from
    // the rewritten form appear here; untouched tables are in
    // `original_accessed_table_names` only.
    //
    // For remote_table_map hits (SELECT only), the value is the remote-side
    // "db.table" pulled from RemoteTable.database/table; the full remote()
    // call with addr/user/password is reflected in `sql_after_rewrite`.
    //
    // For RENAME TABLE, every participating logical table (each `from` and
    // each `to`) appears as its own entry with its rewritten form.
    map<string, string> table_rewrites = 10;
}

service RewriterService {
    rpc Rewrite (RewriteSQLRequest) returns (RewriteSQLResponse) {}
    rpc RewriteErrorMessage (RewriteErrorMessageRequest) returns (RewriteErrorMessageResponse) {}
}

message RewriteErrorMessageRequest {
    string sql = 1;
    string error_message = 2;
    repeated RewriteOption options = 3;
}

message RewriteErrorMessageResponse {
    RewriteCode code = 1;
    string message = 2;
    string error_after_rewrite = 3;
}