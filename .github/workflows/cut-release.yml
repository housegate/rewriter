name: cut-release

# Cut a new vX.Y.Z tag + GitHub Release off main HEAD.
#
# Versioning policy (all timestamps in UTC):
#   - X (major): only bumped via manual `bump=major` input; never auto.
#   - Y (minor): auto-bumped on the first cut of each UTC day; Z resets to 0.
#   - Z (patch): auto-bumped on subsequent cuts within the same UTC day.
#
# After tagging, this workflow dispatches release.yml for the new tag so the
# docker image gets built + pushed too. (A tag push made by GITHUB_TOKEN does
# NOT trigger the `push: tags:['v*']` listener in release.yml; that's a GH
# safeguard against recursive workflow triggers. Hence the explicit dispatch.)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override bump kind (auto=date-based, or minor/patch/major)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, minor, patch, major]
      dry_run:
        description: 'Print the next tag without creating anything'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write   # tag push + release create
  actions: write    # gh workflow run release.yml

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          echo "today_utc=$today"

          # Latest semver tag of the form vX.Y.Z (no suffixes).
          last="$(git tag --list 'v*' --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | head -n 1 || true)"

          if [ -z "$last" ]; then
            new="v0.1.0"
            reason="bootstrap (no prior vX.Y.Z tag found)"
          else
            # Tag creation date in UTC. `creatordate` handles both annotated
            # and lightweight tags (falls back to committer date for the
            # latter). `:unix` gives epoch seconds so we can format with date.
            last_ts="$(git for-each-ref --format='%(creatordate:unix)' "refs/tags/$last")"
            last_date="$(date -u -d "@$last_ts" +%Y-%m-%d)"
            echo "last_tag=$last cut=$last_date"

            IFS='.' read -r major minor patch <<< "${last#v}"

            bump="$BUMP"
            if [ "$bump" = "auto" ]; then
              if [ "$last_date" = "$today" ]; then
                bump=patch
                reason="same UTC day as $last → patch bump"
              else
                bump=minor
                reason="new UTC day (last cut $last_date) → minor bump"
              fi
            else
              reason="explicit bump=$bump"
            fi

            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unknown bump: $bump" >&2; exit 1 ;;
            esac
            new="v${major}.${minor}.${patch}"
          fi

          # Fail early if the computed tag already exists (e.g. racing runs,
          # or someone ran with an explicit bump that collides).
          if git rev-parse --verify --quiet "refs/tags/$new" >/dev/null; then
            echo "Tag $new already exists; refusing to overwrite." >&2
            exit 1
          fi

          echo "Next tag: $new ($reason)"
          {
            echo "next=$new"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Create + push tag
        if: inputs.dry_run != 'true'
        env:
          NEW: ${{ steps.next.outputs.next }}
          REASON: ${{ steps.next.outputs.reason }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW" -m "Release $NEW"$'\n\n'"Cut by cut-release workflow ($REASON)."
          git push origin "$NEW"

      - name: Create GitHub Release
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "$NEW" \
            --title "$NEW" \
            --generate-notes

      - name: Trigger release.yml (docker build)
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --ref main \
            -f ref="$NEW" \
            -f version="${NEW#v}"

      - name: Summary
        env:
          NEW: ${{ steps.next.outputs.next }}
          REASON: ${{ steps.next.outputs.reason }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Cut release"
            echo ""
            echo "- Proposed tag: **\`$NEW\`**"
            echo "- Reason: $REASON"
            if [ "$DRY" = "true" ]; then
              echo "- Mode: **dry run** (no tag, no release, no downstream build)"
            else
              echo "- Tag + release: https://github.com/${{ github.repository }}/releases/tag/$NEW"
              echo "- Docker build: release.yml dispatched with \`version=${NEW#v}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
