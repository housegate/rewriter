# Shared ccache configuration for every rewriter build tree.
#
# CMakeLists.txt points the compiler launcher at this file through
# CCACHE_CONFIGPATH, so it applies to scripts.sh, raw `ninja -C build ...`, and
# the CI/release jobs alike, independent of the host's own ccache config.
# CCACHE_* environment variables still override any value here.
#
# Goal: a new checkout (one directory per feature, the CI and release
# workdirs) reuses the ClickHouse objects that another checkout already
# compiled, as long as the ClickHouse sources, patches, compiler, and flags
# are the same. The cache key is ccache's own per-translation-unit hash of
# the compiler binary, the (path-relativized) command line, and the contents
# of the source and every included header, so a ClickHouse bump, a patch
# change, a compiler upgrade, or a flag change misses automatically.

# One cache shared by all checkouts of the same user.
cache_dir = ${HOME}/.cache/rewriter-ccache

# Rewrite absolute paths under $HOME to paths relative to the compile
# directory, so the same source compiled from ~/a/build and ~/b/build hashes
# identically. Every checkout must therefore live under $HOME.
base_dir = ${HOME}

# ClickHouse compiles with -fdebug-compilation-dir=. and
# -ffile-prefix-map=<source dir>/=, so objects do not embed the build
# directory; hashing it would only defeat sharing across checkouts.
hash_dir = false

# Key on the compiler binary's content, not its mtime, so reinstalling the
# same clang keeps hits and a different clang never does.
compiler_check = content

# One ClickHouse build is about 16k objects; leave room for a few ClickHouse
# versions and compiler configurations.
max_size = 25G
